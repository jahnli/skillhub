spring:
  security:
    oauth2:
      client:
        registration:
          casdoor:
            client-id: ${OAUTH2_CASDOOR_CLIENT_ID}
            client-secret: ${OAUTH2_CASDOOR_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH2_CASDOOR_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}"
            scope: openid,profile,email,phone
            client-name: Casdoor
        provider:
          casdoor:
            issuer-uri: ${OAUTH2_CASDOOR_ISSUER_URI}

skillhub:
  auth:
    casdoor:
      post-logout-redirect-uri: ${OAUTH2_CASDOOR_POST_LOGOUT_REDIRECT_URI:}
