name: Docker Publish
run-name: Docker Publish · ${{ github.ref_name }}${{ inputs.reason && format(' · {0}', inputs.reason) || '' }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for publishing
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine image version
        id: version
        shell: bash
        run: |
          version=$(git describe --tags --always)
          if [[ ! "$version" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::Git version is not a valid Docker tag'
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish skillhub-${{ matrix.component }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: ./server
          - component: web
            context: ./web
          - component: scanner
            context: ./scanner
          - component: github-sync
            context: ./github-sync-go
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/skillhub-${{ matrix.component }}:latest
            ${{ secrets.DOCKER_USERNAME }}/skillhub-${{ matrix.component }}:${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=dockerhub-${{ matrix.component }}
          cache-to: type=gha,scope=dockerhub-${{ matrix.component }},mode=max
